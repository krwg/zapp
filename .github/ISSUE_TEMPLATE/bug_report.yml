name: Bug report
description: Report a problem in zapp (prefills match the in-app About form)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Short description of the problem
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the behavior
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected to happen
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead
    validations:
      required: false
  - type: checkboxes
    id: areas
    attributes:
      label: Areas
      options:
        - label: Bypass
        - label: Smart check
        - label: Updates
        - label: Telegram
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App / engine / proxy versions, OS, elevated — paste from zapp About → Report a bug auto-block if available
      placeholder: |
        - App: 0.2.6
        - Engine: …
        - Telegram proxy: …
        - OS: Windows
    validations:
      required: false
  - type: textarea
    id: errors
    attributes:
      label: Recent errors
      description: Optional recent error lines from zapp (no secrets/tokens)
    validations:
      required: false
